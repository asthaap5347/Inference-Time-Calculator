<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inference Time Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
  body {
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrapper {
    max-width: 640px;
    width: 100%;
    padding: 1.5rem;
  }
  .card {
  background: radial-gradient(circle at top left, #ffffff, #f6f1e8);
  padding: 1.75rem 2rem;
  border-radius: 18px;
  box-shadow:
    0 1px 0 #ffffff inset,
    0 18px 35px rgba(0,0,0,0.25);
  border: 1px solid #d9cbb3;
}
  
  h1 { margin-top: 0; margin-bottom: 0.75rem; }
  label { display: block; margin-top: 1rem; }
  input { margin-left: 0.5rem; padding: 0.25rem 0.4rem; }
  button {
    margin-top: 1.2rem;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #1d4ed8;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
  <h1>Inference Time Calculator</h1>

  <p>
    One copy has chance <code>p</code> of fixing the bug.
    We want the fewest copies so that the chance at least one fixes it
    is at least your target.
  </p>

  <label>
    Chance one copy fixes the bug (p):
    <input id="p" type="number" step="0.001" min="0" max="1" value="0.159" />
  </label>

  <label>
    Target chance (P(E)):
    <input id="target" type="number" step="0.001" min="0" max="0.999" value="0.99" />
  </label>

  <button id="solve">Solve</button>

  <h2>Result</h2>
  <p id="result"></p>

  <script>
    function computeCopies(p, target) {
      // complement rule: P(E) = 1 - (1 - p)^n
      const fail = 1 - p;
      const maxFail = 1 - target;
      if (p <= 0) return Infinity;
      if (target <= 0) return 0;
      // n = ceil( ln(maxFail) / ln(fail) )
      const n = Math.ceil(Math.log(maxFail) / Math.log(fail));
      return n;
    }

    document.getElementById('solve').addEventListener('click', () => {
      const p = parseFloat(document.getElementById('p').value);
      const target = parseFloat(document.getElementById('target').value);

      const n = computeCopies(p, target);
      if (!Number.isFinite(n) || n < 0) {
        document.getElementById('result').textContent =
          'Please use p in (0,1] and target in [0, 0.999).';
        return;
      }

      const fail = 1 - p;
      const pE = 1 - Math.pow(fail, n);

      document.getElementById('result').textContent =
        `Smallest number of copies: ${n}.  With n = ${n}, P(E) ≈ ${pE.toFixed(4)}.`;
    });
  </script>
  </div>
  </div>
</body>
</html>
